services:
  postgres:
    image: postgres:16-alpine
    container_name: smartlife-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - smartlife-backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
    image: smartlife-api:0.1.0
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "127.0.0.1:8001:8000"

    networks:
      - smartlife-backend

networks:
  smartlife-backend:
    driver: bridge

volumes:
  postgres_data:
