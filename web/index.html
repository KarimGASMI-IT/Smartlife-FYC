<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FYC SmartLife v0</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f6fa; margin: 0; padding: 60px 20px; }
    main { max-width: 600px; margin: auto; background: white; padding: 35px; border-radius: 12px; }
    h1 { color: #17365d; }
    button { padding: 10px 18px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>FYC SmartLife v0</h1>
    <p>Laboratoire pédagogique SmartLife.</p>
    <h2>État des services</h2>
    <p id="status">Vérification en cours...</p>
    <button onclick="verifier()">Actualiser</button>
  </main>
  <script>
    async function verifier() {
      const element = document.getElementById("status");
      try {
        const reponse = await fetch("/api/health/db");
        if (!reponse.ok) throw new Error("Service indisponible");
        const donnees = await reponse.json();
        element.textContent =
          donnees.status === "healthy" && donnees.database === "connected"
            ? "API et PostgreSQL : opérationnels"
            : "Service indisponible";
      } catch {
        element.textContent = "API ou PostgreSQL indisponible";
      }
    }
    verifier();
  </script>
</body>
</html>
